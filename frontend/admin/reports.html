<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports - Admin - BlueDart Express</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .report-card { background: white; border-radius: var(--border-radius); padding: 24px; box-shadow: var(--shadow); }
    .bar-container { margin-top: 16px; }
    .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .bar-label { min-width: 140px; font-size: 13px; font-weight: 600; color: var(--gray-700); }
    .bar-track { flex: 1; background: var(--gray-100); border-radius: 20px; height: 10px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 20px; transition: width 0.6s ease; }
    .bar-count { font-size: 13px; font-weight: 700; color: var(--gray-700); min-width: 30px; text-align: right; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="navbar-logo">📦</span>Blue<span style="color:var(--secondary)">Dart</span> Express</div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="background:var(--danger);color:white;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;">ADMIN</span>
    <div class="user-avatar" id="nav-user-avatar">A</div>
    <span id="nav-user-name" style="font-weight:600;font-size:14px;"></span>
    <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-menu">
      <div class="sidebar-label">Management</div>
      <div class="sidebar-item"><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></div>
      <div class="sidebar-item"><a href="customers.html"><span class="icon">👥</span> Customers</a></div>
      <div class="sidebar-item"><a href="agents.html"><span class="icon">🚚</span> Delivery Agents</a></div>
      <div class="sidebar-item"><a href="couriers.html"><span class="icon">📦</span> All Couriers</a></div>
      <div class="sidebar-item"><a href="assign.html"><span class="icon">📋</span> Assign Agent</a></div>
      <div class="sidebar-item"><a href="reports.html" class="active"><span class="icon">📈</span> Reports</a></div>
      <div class="sidebar-label">System</div>
      <div class="sidebar-item"><a href="#" onclick="logout()"><span class="icon">🚪</span> Logout</a></div>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header"><h1>Reports & Analytics</h1><p>Shipment statistics and performance overview</p></div>

    <div id="content"><div class="spinner"></div></div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
  if (!requireAuth('admin')) {}
  renderNavUser();

  const STATUS_COLORS = {
    BOOKED: '#3b82f6', PICKED_UP: '#f59e0b', IN_TRANSIT: '#8b5cf6',
    AT_HUB: '#6366f1', OUT_FOR_DELIVERY: '#f97316', DELIVERED: '#10b981',
    DELIVERY_FAILED: '#ef4444', CANCELLED: '#9ca3af',
  };

  async function loadReports() {
    try {
      const [dashData, reportData] = await Promise.all([API.getAdminDashboard(), API.getReports()]);
      const stats = dashData.stats;
      const { statusCounts, packageTypes, dailyBookings } = reportData.reports;

      const total = statusCounts.reduce((sum, s) => sum + parseInt(s.dataValues?.count || s.count || 0), 0) || 1;

      document.getElementById('content').innerHTML = `
        <!-- Summary Cards -->
        <div class="grid-4" style="margin-bottom:24px;">
          <div class="stat-card"><div class="stat-icon blue">📦</div><div class="stat-info"><p>Total Couriers</p><h3>${stats.totalCouriers}</h3></div></div>
          <div class="stat-card"><div class="stat-icon green">✅</div><div class="stat-info"><p>Delivered</p><h3>${stats.deliveredShipments}</h3></div></div>
          <div class="stat-card"><div class="stat-icon orange">🚚</div><div class="stat-info"><p>In Transit</p><h3>${stats.inTransitShipments}</h3></div></div>
          <div class="stat-card"><div class="stat-icon red">❌</div><div class="stat-info"><p>Failed</p><h3>${stats.failedDeliveries}</h3></div></div>
        </div>

        <div class="grid-2" style="gap:20px;margin-bottom:20px;">
          <!-- Status Distribution -->
          <div class="report-card">
            <h3 style="font-size:17px;font-weight:700;margin-bottom:4px;">📊 Shipment Status Distribution</h3>
            <p style="font-size:13px;color:var(--gray-500);margin-bottom:16px;">Breakdown of all couriers by status</p>
            <div class="bar-container">
              ${statusCounts.map(s => {
                const st = s.status || s.dataValues?.status;
                const cnt = parseInt(s.dataValues?.count || s.count || 0);
                const pct = Math.round((cnt / total) * 100);
                return `
                  <div class="bar-row">
                    <div class="bar-label">${st?.replace(/_/g,' ') || '—'}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${STATUS_COLORS[st]||'#6b7280'};"></div></div>
                    <div class="bar-count">${cnt}</div>
                  </div>`;
              }).join('')}
            </div>
          </div>

          <!-- Package Type Distribution -->
          <div class="report-card">
            <h3 style="font-size:17px;font-weight:700;margin-bottom:4px;">📦 Package Types</h3>
            <p style="font-size:13px;color:var(--gray-500);margin-bottom:16px;">Breakdown by package category</p>
            <div class="bar-container">
              ${packageTypes.map(p => {
                const pt = p.packageType || p.dataValues?.packageType;
                const cnt = parseInt(p.dataValues?.count || p.count || 0);
                const pct = Math.round((cnt / total) * 100);
                const colors = { parcel:'#3b82f6',document:'#10b981',electronics:'#8b5cf6',fragile:'#f97316',clothing:'#f59e0b',other:'#6b7280' };
                return `
                  <div class="bar-row">
                    <div class="bar-label">${capitalize(pt) || '—'}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colors[pt]||'#6b7280'};"></div></div>
                    <div class="bar-count">${cnt}</div>
                  </div>`;
              }).join('')}
            </div>
          </div>
        </div>

        <!-- Daily Bookings -->
        <div class="report-card">
          <h3 style="font-size:17px;font-weight:700;margin-bottom:4px;">📅 Bookings - Last 7 Days</h3>
          <p style="font-size:13px;color:var(--gray-500);margin-bottom:20px;">Daily booking count</p>
          ${dailyBookings.length ? `
          <div style="display:flex;align-items:flex-end;gap:12px;height:120px;padding-bottom:8px;">
            ${dailyBookings.map(d => {
              const cnt = parseInt(d.dataValues?.count || d.count || 0);
              const maxVal = Math.max(...dailyBookings.map(x => parseInt(x.dataValues?.count || x.count || 0)), 1);
              const height = Math.max((cnt / maxVal) * 100, 8);
              const date = d.dataValues?.date || d.date;
              return `
                <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
                  <div style="font-size:12px;font-weight:700;color:var(--gray-700);">${cnt}</div>
                  <div style="width:100%;background:var(--primary);border-radius:4px 4px 0 0;height:${height}%;"></div>
                  <div style="font-size:11px;color:var(--gray-500);">${date ? new Date(date).toLocaleDateString('en-IN',{month:'short',day:'numeric'}) : '—'}</div>
                </div>`;
            }).join('')}
          </div>` : '<p style="color:var(--gray-500);font-size:14px;">No booking data for last 7 days.</p>'}
        </div>

        <!-- Summary Table -->
        <div class="report-card" style="margin-top:20px;">
          <h3 style="font-size:17px;font-weight:700;margin-bottom:16px;">📋 Summary Statistics</h3>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Metric</th><th>Value</th><th>Percentage</th></tr></thead>
              <tbody>
                <tr><td>Total Customers</td><td style="font-weight:700;">${stats.totalCustomers}</td><td>—</td></tr>
                <tr><td>Total Delivery Agents</td><td style="font-weight:700;">${stats.totalAgents}</td><td>—</td></tr>
                <tr><td>Total Couriers Booked</td><td style="font-weight:700;">${stats.totalCouriers}</td><td>100%</td></tr>
                <tr><td>Successfully Delivered</td><td style="font-weight:700;color:var(--success);">${stats.deliveredShipments}</td><td>${stats.totalCouriers ? Math.round((stats.deliveredShipments/stats.totalCouriers)*100) : 0}%</td></tr>
                <tr><td>Currently In Transit</td><td style="font-weight:700;color:var(--primary);">${stats.inTransitShipments}</td><td>${stats.totalCouriers ? Math.round((stats.inTransitShipments/stats.totalCouriers)*100) : 0}%</td></tr>
                <tr><td>Pending Pickup</td><td style="font-weight:700;color:var(--warning);">${stats.pendingShipments}</td><td>${stats.totalCouriers ? Math.round((stats.pendingShipments/stats.totalCouriers)*100) : 0}%</td></tr>
                <tr><td>Failed Deliveries</td><td style="font-weight:700;color:var(--danger);">${stats.failedDeliveries}</td><td>${stats.totalCouriers ? Math.round((stats.failedDeliveries/stats.totalCouriers)*100) : 0}%</td></tr>
                <tr><td>Cancelled</td><td style="font-weight:700;color:var(--gray-500);">${stats.cancelledShipments}</td><td>${stats.totalCouriers ? Math.round((stats.cancelledShipments/stats.totalCouriers)*100) : 0}%</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      `;
    } catch (e) {
      document.getElementById('content').innerHTML = `<div class="alert alert-error">Failed to load reports: ${e.message}</div>`;
    }
  }

  loadReports();
</script>
</body>
</html>
