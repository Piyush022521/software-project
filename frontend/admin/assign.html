<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assign Agent - Admin - BlueDart Express</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .detail-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--gray-100); font-size:14px; }
    .detail-label { color:var(--gray-500); font-weight:600; }
    .detail-value { color:var(--gray-900); font-weight:600; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="navbar-logo">📦</span>Blue<span style="color:var(--secondary)">Dart</span> Express</div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="background:var(--danger);color:white;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;">ADMIN</span>
    <div class="user-avatar" id="nav-user-avatar">A</div>
    <span id="nav-user-name" style="font-weight:600;font-size:14px;"></span>
    <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-menu">
      <div class="sidebar-label">Management</div>
      <div class="sidebar-item"><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></div>
      <div class="sidebar-item"><a href="customers.html"><span class="icon">👥</span> Customers</a></div>
      <div class="sidebar-item"><a href="agents.html"><span class="icon">🚚</span> Delivery Agents</a></div>
      <div class="sidebar-item"><a href="couriers.html"><span class="icon">📦</span> All Couriers</a></div>
      <div class="sidebar-item"><a href="assign.html" class="active"><span class="icon">📋</span> Assign Agent</a></div>
      <div class="sidebar-item"><a href="reports.html"><span class="icon">📈</span> Reports</a></div>
      <div class="sidebar-label">System</div>
      <div class="sidebar-item"><a href="#" onclick="logout()"><span class="icon">🚪</span> Logout</a></div>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header"><h1>Assign Delivery Agent</h1><p>Assign or change delivery agents for couriers</p></div>

    <!-- Search Courier -->
    <div class="card" style="margin-bottom:24px;">
      <h3 style="font-size:16px;font-weight:700;margin-bottom:14px;">🔍 Find Courier</h3>
      <div style="display:flex;gap:8px;">
        <input type="text" id="tracking-search" class="form-control" placeholder="Enter Tracking Number (e.g. BD2026001003)" style="max-width:360px;" />
        <button class="btn btn-primary" onclick="searchCourier()">Search</button>
      </div>
    </div>

    <div id="courier-info"></div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
  if (!requireAuth('admin')) {}
  renderNavUser();

  let currentCourier = null;
  let allAgents = [];

  async function init() {
    // Pre-load agents
    try {
      const data = await API.getDeliveryAgents();
      allAgents = data.agents;
    } catch (e) {}

    // Check URL param
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (id) loadCourierById(id);
  }

  async function loadCourierById(id) {
    try {
      const data = await API.getCourier(id);
      currentCourier = data.courier;
      renderCourierInfo(data.courier);
    } catch (e) {
      document.getElementById('courier-info').innerHTML = `<div class="alert alert-error">Failed to load courier: ${e.message}</div>`;
    }
  }

  async function searchCourier() {
    const tn = document.getElementById('tracking-search').value.trim().toUpperCase();
    if (!tn) return;
    const area = document.getElementById('courier-info');
    area.innerHTML = '<div class="spinner"></div>';
    try {
      const data = await API.getAdminCouriers(`?search=${tn}`);
      if (!data.couriers.length) {
        area.innerHTML = '<div class="alert alert-error">No courier found with that tracking number.</div>';
        return;
      }
      currentCourier = data.couriers[0];
      renderCourierInfo(data.couriers[0]);
    } catch (e) {
      area.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    }
  }

  function renderCourierInfo(c) {
    const agentOptions = allAgents.map(a =>
      `<option value="${a.id}" ${c.agentId === a.id ? 'selected' : ''}>${a.user?.name} (${a.serviceArea || 'Any Area'})</option>`
    ).join('');

    const history = [...(c.trackingHistory || [])].reverse();
    const statusIcon = { BOOKED:'📋',PICKED_UP:'📦',IN_TRANSIT:'🚚',AT_HUB:'🏭',OUT_FOR_DELIVERY:'🛵',DELIVERED:'✅',DELIVERY_FAILED:'❌',CANCELLED:'🚫' };

    document.getElementById('courier-info').innerHTML = `
      <div class="grid-2" style="gap:20px;margin-bottom:20px;">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <div>
              <div style="font-size:20px;font-weight:900;color:var(--primary);">${c.trackingNumber}</div>
              <div style="font-size:13px;color:var(--gray-500);">Booked ${formatDate(c.createdAt)}</div>
            </div>
            ${statusBadge(c.status)}
          </div>
          <div class="detail-row"><span class="detail-label">Sender</span><span class="detail-value">${c.senderName}</span></div>
          <div class="detail-row"><span class="detail-label">Receiver</span><span class="detail-value">${c.receiverName}</span></div>
          <div class="detail-row"><span class="detail-label">Route</span><span class="detail-value">${c.pickupLocation} → ${c.deliveryLocation}</span></div>
          <div class="detail-row"><span class="detail-label">Weight</span><span class="detail-value">${c.packageWeight} kg</span></div>
          <div class="detail-row"><span class="detail-label">Delivery Type</span><span class="detail-value">${capitalize(c.deliveryType)}</span></div>
          <div class="detail-row"><span class="detail-label">Charge</span><span class="detail-value">${formatCurrency(c.deliveryCharge)}</span></div>
          <div class="detail-row"><span class="detail-label">Current Agent</span><span class="detail-value">${c.agent ? c.agent.user.name : '<span style="color:var(--warning)">Unassigned</span>'}</span></div>
        </div>

        <div class="card">
          <h3 style="font-size:16px;font-weight:700;margin-bottom:20px;">👷 Assign Delivery Agent</h3>
          <div class="form-group">
            <label class="form-label">Select Agent</label>
            <select id="agent-select" class="form-control">
              <option value="">-- Select Agent --</option>
              ${agentOptions}
            </select>
          </div>
          <div id="assign-alert"></div>
          <button class="btn btn-primary" onclick="assignAgent(${c.id})">✅ Assign Agent</button>

          <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--gray-100);">
            <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;">🔄 Update Status</h3>
            <div class="form-group">
              <select id="new-status" class="form-control">
                <option value="BOOKED">Booked</option>
                <option value="PICKED_UP">Picked Up</option>
                <option value="IN_TRANSIT">In Transit</option>
                <option value="AT_HUB">At Hub</option>
                <option value="OUT_FOR_DELIVERY">Out for Delivery</option>
                <option value="DELIVERED">Delivered</option>
                <option value="DELIVERY_FAILED">Delivery Failed</option>
                <option value="CANCELLED">Cancelled</option>
              </select>
            </div>
            <div class="form-group">
              <input type="text" id="status-location" class="form-control" placeholder="Location (optional)" />
            </div>
            <div class="form-group">
              <textarea id="status-remarks" class="form-control" rows="2" placeholder="Remarks (optional)"></textarea>
            </div>
            <button class="btn btn-warning" onclick="updateStatus(${c.id})">Update Status</button>
          </div>
        </div>
      </div>

      <!-- Tracking History -->
      <div class="card">
        <h3 style="font-size:16px;font-weight:700;margin-bottom:20px;">📋 Tracking History</h3>
        <div class="timeline">
          ${history.map((h, i) => `
            <div class="timeline-item">
              <div class="timeline-dot ${i===0?(h.status==='DELIVERED'?'delivered':'active'):''}"></div>
              <div class="timeline-content">
                <h4>${statusIcon[h.status]||'●'} ${h.status.replace(/_/g,' ')}</h4>
                <p>${h.location||'—'} ${h.remarks?'· '+h.remarks:''}</p>
                <div class="time">${formatDateTime(h.timestamp)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    // Set current status in dropdown
    if (c.status) {
      const sel = document.getElementById('new-status');
      if (sel) sel.value = c.status;
    }
  }

  async function assignAgent(courierId) {
    const agentId = document.getElementById('agent-select').value;
    if (!agentId) {
      document.getElementById('assign-alert').innerHTML = '<div class="alert alert-warning">Please select an agent.</div>';
      return;
    }
    try {
      await API.assignAgent(courierId, parseInt(agentId));
      showToast('Agent assigned successfully!', 'success');
      loadCourierById(courierId);
    } catch (e) {
      document.getElementById('assign-alert').innerHTML = `<div class="alert alert-error">❌ ${e.message}</div>`;
    }
  }

  async function updateStatus(courierId) {
    const status = document.getElementById('new-status').value;
    const location = document.getElementById('status-location').value;
    const remarks = document.getElementById('status-remarks').value;
    try {
      await API.updateShipmentStatus(courierId, { status, location, remarks });
      showToast(`Status updated to ${status}`, 'success');
      loadCourierById(courierId);
    } catch (e) {
      showToast('Update failed: ' + e.message, 'error');
    }
  }

  init();
</script>
</body>
</html>
