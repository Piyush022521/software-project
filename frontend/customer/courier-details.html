<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courier Details - BlueDart Express</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--gray-100); font-size: 14px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--gray-500); font-weight: 600; }
    .detail-value { color: var(--gray-900); font-weight: 600; text-align: right; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="navbar-logo">📦</span>Blue<span style="color:var(--secondary)">Dart</span> Express</div>
  <div class="navbar-user">
    <div class="user-avatar" id="nav-user-avatar">U</div>
    <span id="nav-user-name" style="font-weight:600;font-size:14px;"></span>
    <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-menu">
      <div class="sidebar-label">Customer Menu</div>
      <div class="sidebar-item"><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></div>
      <div class="sidebar-item"><a href="book-courier.html"><span class="icon">➕</span> Book Courier</a></div>
      <div class="sidebar-item"><a href="my-couriers.html" class="active"><span class="icon">📦</span> My Couriers</a></div>
      <div class="sidebar-item"><a href="track.html"><span class="icon">📍</span> Track Shipment</a></div>
      <div class="sidebar-label">Account</div>
      <div class="sidebar-item"><a href="profile.html"><span class="icon">👤</span> Profile</a></div>
      <div class="sidebar-item"><a href="#" onclick="logout()"><span class="icon">🚪</span> Logout</a></div>
    </div>
  </aside>

  <main class="main-content">
    <div style="margin-bottom:20px;">
      <a href="my-couriers.html" style="color:var(--primary);font-size:14px;">← Back to My Couriers</a>
    </div>

    <div id="content"><div class="spinner"></div></div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
  if (!requireAuth('customer')) {}
  renderNavUser();

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  async function loadDetails() {
    if (!id) { window.location.href = 'my-couriers.html'; return; }

    try {
      const data = await API.getCourier(id);
      const c = data.courier;
      const history = [...(c.trackingHistory || [])].reverse();

      const statusIcon = { BOOKED:'📋',PICKED_UP:'📦',IN_TRANSIT:'🚚',AT_HUB:'🏭',OUT_FOR_DELIVERY:'🛵',DELIVERED:'✅',DELIVERY_FAILED:'❌',CANCELLED:'🚫' };

      document.getElementById('content').innerHTML = `
        <!-- Header -->
        <div class="card" style="margin-bottom:20px;">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
            <div>
              <div style="font-size:12px;color:var(--gray-500);text-transform:uppercase;font-weight:700;">Tracking Number</div>
              <div style="font-size:28px;font-weight:900;color:var(--primary);">${c.trackingNumber}</div>
            </div>
            <div style="text-align:right;">
              ${statusBadge(c.status)}
              <div style="font-size:13px;color:var(--gray-500);margin-top:6px;">Booked: ${formatDateTime(c.createdAt)}</div>
            </div>
          </div>
          ${c.status === 'BOOKED' ? `
          <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--gray-100);">
            <button class="btn btn-danger btn-sm" onclick="cancelCourier(${c.id})">🚫 Cancel Booking</button>
          </div>` : ''}
        </div>

        <div class="grid-2" style="gap:20px;margin-bottom:20px;">
          <!-- Sender & Receiver -->
          <div class="card">
            <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;color:var(--primary);">📤 Sender</h3>
            <div class="detail-row"><span class="detail-label">Name</span><span class="detail-value">${c.senderName}</span></div>
            <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value">${c.senderPhone}</span></div>
            <div class="detail-row"><span class="detail-label">Address</span><span class="detail-value" style="max-width:200px;text-align:right;">${c.senderAddress}</span></div>
            <div class="detail-row"><span class="detail-label">Pickup City</span><span class="detail-value">${c.pickupLocation}</span></div>
          </div>
          <div class="card">
            <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;color:var(--success);">📥 Receiver</h3>
            <div class="detail-row"><span class="detail-label">Name</span><span class="detail-value">${c.receiverName}</span></div>
            <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value">${c.receiverPhone}</span></div>
            <div class="detail-row"><span class="detail-label">Address</span><span class="detail-value" style="max-width:200px;text-align:right;">${c.receiverAddress}</span></div>
            <div class="detail-row"><span class="detail-label">Delivery City</span><span class="detail-value">${c.deliveryLocation}</span></div>
          </div>
        </div>

        <div class="grid-2" style="gap:20px;margin-bottom:20px;">
          <!-- Package Info -->
          <div class="card">
            <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;color:var(--secondary);">📦 Package Details</h3>
            <div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">${capitalize(c.packageType)}</span></div>
            <div class="detail-row"><span class="detail-label">Weight</span><span class="detail-value">${c.packageWeight} kg</span></div>
            <div class="detail-row"><span class="detail-label">Description</span><span class="detail-value">${c.packageDescription || '—'}</span></div>
            <div class="detail-row"><span class="detail-label">Pickup Date</span><span class="detail-value">${formatDate(c.pickupDate)}</span></div>
            <div class="detail-row"><span class="detail-label">Delivery Type</span><span class="detail-value">${capitalize(c.deliveryType)}</span></div>
          </div>
          <!-- Payment Info -->
          <div class="card">
            <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;color:#7c3aed;">💳 Payment Details</h3>
            <div class="detail-row"><span class="detail-label">Delivery Charge</span><span class="detail-value" style="font-size:20px;color:var(--primary);">${formatCurrency(c.deliveryCharge)}</span></div>
            <div class="detail-row"><span class="detail-label">Payment Method</span><span class="detail-value">${c.paymentMethod?.toUpperCase()}</span></div>
            <div class="detail-row"><span class="detail-label">Payment Status</span><span class="detail-value">
              <span style="background:${c.paymentStatus==='paid'?'#d1fae5':'#fef3c7'};color:${c.paymentStatus==='paid'?'#065f46':'#92400e'};padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;">
                ${c.paymentStatus?.toUpperCase()}
              </span>
            </span></div>
            ${c.agent ? `<div class="detail-row"><span class="detail-label">Agent</span><span class="detail-value">${c.agent.user.name}</span></div>` : ''}
          </div>
        </div>

        <!-- Tracking Timeline -->
        <div class="card">
          <h3 style="font-size:16px;font-weight:700;margin-bottom:20px;">📋 Tracking History</h3>
          <div class="timeline">
            ${history.length ? history.map((h, i) => `
              <div class="timeline-item">
                <div class="timeline-dot ${i===0?(h.status==='DELIVERED'?'delivered':'active'):''}"></div>
                <div class="timeline-content">
                  <h4>${statusIcon[h.status]||'●'} ${h.status.replace(/_/g,' ')}</h4>
                  <p>${h.location||'—'} ${h.remarks?'· '+h.remarks:''}</p>
                  <div class="time">${formatDateTime(h.timestamp)}</div>
                </div>
              </div>
            `).join('') : '<p style="color:var(--gray-500);font-size:14px;">No tracking updates yet.</p>'}
          </div>
        </div>
      `;
    } catch (e) {
      document.getElementById('content').innerHTML = `<div class="alert alert-error">Failed to load courier: ${e.message}</div>`;
    }
  }

  async function cancelCourier(id) {
    if (!confirm('Are you sure you want to cancel this booking?')) return;
    try {
      await API.cancelCourier(id);
      showToast('Booking cancelled.', 'success');
      loadDetails();
    } catch (e) {
      showToast('Cancel failed: ' + e.message, 'error');
    }
  }

  loadDetails();
</script>
</body>
</html>
