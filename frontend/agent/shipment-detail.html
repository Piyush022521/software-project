<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shipment Details - BlueDart Express</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .detail-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--gray-100); font-size:14px; }
    .detail-row:last-child { border-bottom:none; }
    .detail-label { color:var(--gray-500); font-weight:600; }
    .detail-value { color:var(--gray-900); font-weight:600; }
    .status-btn { flex:1; text-align:center; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><span class="navbar-logo">📦</span>Blue<span style="color:var(--secondary)">Dart</span> Express</div>
  <div class="navbar-user">
    <div class="user-avatar" id="nav-user-avatar">A</div>
    <span id="nav-user-name" style="font-weight:600;font-size:14px;"></span>
    <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-menu">
      <div class="sidebar-label">Agent Menu</div>
      <div class="sidebar-item"><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></div>
      <div class="sidebar-item"><a href="shipments.html" class="active"><span class="icon">🚚</span> Assigned Shipments</a></div>
      <div class="sidebar-label">Account</div>
      <div class="sidebar-item"><a href="profile.html"><span class="icon">👤</span> Profile</a></div>
      <div class="sidebar-item"><a href="#" onclick="logout()"><span class="icon">🚪</span> Logout</a></div>
    </div>
  </aside>

  <main class="main-content">
    <div style="margin-bottom:20px;"><a href="shipments.html" style="color:var(--primary);font-size:14px;">← Back to Shipments</a></div>
    <div id="content"><div class="spinner"></div></div>
  </main>
</div>

<!-- Update Status Modal -->
<div class="modal-overlay hidden" id="status-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Update Shipment Status</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">New Status</label>
      <select id="new-status" class="form-control">
        <option value="PICKED_UP">Picked Up</option>
        <option value="IN_TRANSIT">In Transit</option>
        <option value="AT_HUB">At Hub</option>
        <option value="OUT_FOR_DELIVERY">Out for Delivery</option>
        <option value="DELIVERED">Delivered</option>
        <option value="DELIVERY_FAILED">Delivery Failed</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Location</label>
      <input type="text" id="status-location" class="form-control" placeholder="Current location" />
    </div>
    <div class="form-group">
      <label class="form-label">Remarks</label>
      <textarea id="status-remarks" class="form-control" rows="3" placeholder="Add delivery remarks..."></textarea>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="submitStatusUpdate()">Update Status</button>
      <button class="btn btn-light" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
  if (!requireAuth('agent')) {}
  renderNavUser();

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  let currentCourier = null;

  async function loadDetail() {
    if (!id) { window.location.href = 'shipments.html'; return; }
    try {
      const data = await API.getCourier(id);
      currentCourier = data.courier;
      render(data.courier);
    } catch (e) {
      document.getElementById('content').innerHTML = `<div class="alert alert-error">Failed to load: ${e.message}</div>`;
    }
  }

  function render(c) {
    const history = [...(c.trackingHistory || [])].reverse();
    const statusIcon = { BOOKED:'📋',PICKED_UP:'📦',IN_TRANSIT:'🚚',AT_HUB:'🏭',OUT_FOR_DELIVERY:'🛵',DELIVERED:'✅',DELIVERY_FAILED:'❌',CANCELLED:'🚫' };
    const isActive = !['DELIVERED','DELIVERY_FAILED','CANCELLED'].includes(c.status);

    document.getElementById('content').innerHTML = `
      <div class="card" style="margin-bottom:20px;">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center;">
          <div>
            <div style="font-size:22px;font-weight:900;color:var(--primary);">${c.trackingNumber}</div>
            <div style="font-size:14px;color:var(--gray-500);">${c.customer?.name || ''} · Booked ${formatDate(c.createdAt)}</div>
          </div>
          <div>${statusBadge(c.status)}</div>
        </div>
        ${isActive ? `
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--gray-100);">
          <button class="btn btn-primary" onclick="openStatusModal()">🔄 Update Status</button>
        </div>` : ''}
      </div>

      <div class="grid-2" style="gap:20px;margin-bottom:20px;">
        <div class="card">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:14px;color:var(--primary);">📤 Pickup Details</h3>
          <div class="detail-row"><span class="detail-label">Sender</span><span class="detail-value">${c.senderName}</span></div>
          <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value">${c.senderPhone}</span></div>
          <div class="detail-row"><span class="detail-label">Address</span><span class="detail-value" style="max-width:200px;text-align:right;">${c.senderAddress}</span></div>
          <div class="detail-row"><span class="detail-label">City</span><span class="detail-value">${c.pickupLocation}</span></div>
          <div class="detail-row"><span class="detail-label">Pickup Date</span><span class="detail-value">${formatDate(c.pickupDate)}</span></div>
        </div>
        <div class="card">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:14px;color:var(--success);">📥 Delivery Details</h3>
          <div class="detail-row"><span class="detail-label">Receiver</span><span class="detail-value">${c.receiverName}</span></div>
          <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value">${c.receiverPhone}</span></div>
          <div class="detail-row"><span class="detail-label">Address</span><span class="detail-value" style="max-width:200px;text-align:right;">${c.receiverAddress}</span></div>
          <div class="detail-row"><span class="detail-label">City</span><span class="detail-value">${c.deliveryLocation}</span></div>
          <div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">${capitalize(c.deliveryType)}</span></div>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:14px;color:var(--secondary);">📦 Package Info</h3>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">
          <div style="background:var(--gray-100);padding:12px;border-radius:8px;"><div style="font-size:11px;color:var(--gray-500);font-weight:700;text-transform:uppercase;">Type</div><div style="font-weight:700;margin-top:4px;">${capitalize(c.packageType)}</div></div>
          <div style="background:var(--gray-100);padding:12px;border-radius:8px;"><div style="font-size:11px;color:var(--gray-500);font-weight:700;text-transform:uppercase;">Weight</div><div style="font-weight:700;margin-top:4px;">${c.packageWeight} kg</div></div>
          <div style="background:var(--gray-100);padding:12px;border-radius:8px;"><div style="font-size:11px;color:var(--gray-500);font-weight:700;text-transform:uppercase;">Charge</div><div style="font-weight:700;margin-top:4px;">${formatCurrency(c.deliveryCharge)}</div></div>
          <div style="background:var(--gray-100);padding:12px;border-radius:8px;"><div style="font-size:11px;color:var(--gray-500);font-weight:700;text-transform:uppercase;">Payment</div><div style="font-weight:700;margin-top:4px;">${c.paymentMethod?.toUpperCase()}</div></div>
        </div>
      </div>

      <div class="card">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:20px;">📋 Tracking History</h3>
        <div class="timeline">
          ${history.map((h, i) => `
            <div class="timeline-item">
              <div class="timeline-dot ${i===0?(h.status==='DELIVERED'?'delivered':h.status==='DELIVERY_FAILED'?'failed':'active'):''}"></div>
              <div class="timeline-content">
                <h4>${statusIcon[h.status]||'●'} ${h.status.replace(/_/g,' ')}</h4>
                <p>${h.location||'—'} ${h.remarks?'· '+h.remarks:''}</p>
                <div class="time">${formatDateTime(h.timestamp)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function openStatusModal() {
    if (!currentCourier) return;
    document.getElementById('status-location').value = currentCourier.deliveryLocation || '';
    document.getElementById('status-modal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('status-modal').classList.add('hidden');
  }

  async function submitStatusUpdate() {
    const status = document.getElementById('new-status').value;
    const location = document.getElementById('status-location').value;
    const remarks = document.getElementById('status-remarks').value;

    try {
      await API.updateShipmentStatus(id, { status, location, remarks });
      showToast(`Status updated to ${status.replace(/_/g,' ')}`, 'success');
      closeModal();
      loadDetail();
    } catch (e) {
      showToast('Update failed: ' + e.message, 'error');
    }
  }

  loadDetail();
</script>
</body>
</html>
