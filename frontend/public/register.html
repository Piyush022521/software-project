<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - BlueDart Express</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { background: linear-gradient(135deg, #1a56db 0%, #0e3a8a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-box { background: white; border-radius: 16px; padding: 40px; max-width: 480px; width: 100%; box-shadow: var(--shadow-lg); }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .logo-icon { font-size: 48px; }
    .auth-logo h2 { font-size: 24px; font-weight: 800; color: var(--primary); margin-top: 8px; }
    .auth-logo p { color: var(--gray-500); font-size: 14px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--gray-500); }
    .auth-footer a { color: var(--primary); font-weight: 600; }
    .back-home { position: fixed; top: 20px; left: 20px; }
  </style>
</head>
<body>

<a href="index.html" class="btn btn-light btn-sm back-home">← Home</a>

<div class="auth-box">
  <div class="auth-logo">
    <div class="logo-icon">📦</div>
    <h2>Create Account</h2>
    <p>Register as a customer to book couriers</p>
  </div>

  <div id="alert-box"></div>

  <form id="register-form">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" id="name" class="form-control" placeholder="Your full name" required />
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="10-digit number" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Email Address *</label>
      <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Password *</label>
        <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required />
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password *</label>
        <input type="password" id="confirm-password" class="form-control" placeholder="Repeat password" required />
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-btn">
      Create Account
    </button>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="login.html">Sign in here</a>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
  redirectIfLoggedIn();

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('register-btn');
    const alertBox = document.getElementById('alert-box');
    alertBox.innerHTML = '';

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm-password').value;

    if (password !== confirm) {
      alertBox.innerHTML = '<div class="alert alert-error">❌ Passwords do not match.</div>';
      return;
    }

    if (password.length < 6) {
      alertBox.innerHTML = '<div class="alert alert-error">❌ Password must be at least 6 characters.</div>';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      const data = await API.register({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password,
        phone: document.getElementById('phone').value,
      });

      saveAuth(data.token, data.user);
      showToast('Registration successful! Welcome!', 'success');
      redirectToDashboard(data.user.role);
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">❌ ${err.message}</div>`;
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
