<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - BlueDart Express</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { background: linear-gradient(135deg, #1a56db 0%, #0e3a8a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-box { background: white; border-radius: 16px; padding: 40px; max-width: 420px; width: 100%; box-shadow: var(--shadow-lg); }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .logo-icon { font-size: 48px; }
    .auth-logo h2 { font-size: 24px; font-weight: 800; color: var(--primary); margin-top: 8px; }
    .auth-logo p { color: var(--gray-500); font-size: 14px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--gray-500); }
    .auth-footer a { color: var(--primary); font-weight: 600; }
    .back-home { position: fixed; top: 20px; left: 20px; }
  </style>
</head>
<body>

<a href="index.html" class="btn btn-light btn-sm back-home">← Home</a>

<div class="auth-box">
  <div class="auth-logo">
    <div class="logo-icon">📦</div>
    <h2>BlueDart Express</h2>
    <p>Sign in to your account</p>
  </div>

  <div id="alert-box"></div>

  <form id="login-form">
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control" placeholder="Enter your password" required />
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
      Sign In
    </button>
  </form>

  <div style="margin:20px 0;text-align:center;color:var(--gray-500);font-size:13px;">— Demo Credentials —</div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <button class="btn btn-light btn-sm" onclick="fillCreds('admin@courier.com','Admin@123')">👑 Admin Login</button>
    <button class="btn btn-light btn-sm" onclick="fillCreds('customer@courier.com','Customer@123')">👤 Customer Login</button>
    <button class="btn btn-light btn-sm" onclick="fillCreds('agent@courier.com','Agent@123')">🚚 Agent Login</button>
  </div>

  <div class="auth-footer">
    Don't have an account? <a href="register.html">Register here</a>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
  redirectIfLoggedIn();

  function fillCreds(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const alertBox = document.getElementById('alert-box');
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    alertBox.innerHTML = '';

    try {
      const data = await API.login({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });

      saveAuth(data.token, data.user);
      showToast('Login successful!', 'success');
      redirectToDashboard(data.user.role);
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">❌ ${err.message}</div>`;
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
